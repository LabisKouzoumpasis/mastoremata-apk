<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F1EC">
<title>Μαστορέματα</title>
<style>
:root{
  color-scheme: light;
  --bg:#F3F1EC; --surface:#FFFFFF; --ink:#22201C; --muted:#625C53; --line:#DDD7CC; --soft:#EAE5DC;
  --pri:#A94B1A; --pri-ink:#FFFFFF; --pri-soft:#F6E1D3; --ok:#3F6A2A; --ok-ink:#FFFFFF; --warn:#8F5A06; --warn-bg:#FBEFD6; --bad:#B23A22; --bad-bg:#F8E1DC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    color-scheme: dark;
    --bg:#161514; --surface:#201E1C; --ink:#ECE7DF; --muted:#A79F94; --line:#38332D; --soft:#2A2724;
    --pri:#F0A06A; --pri-ink:#1A1410; --pri-soft:#43301F; --ok:#8CC06A; --ok-ink:#10200A; --warn:#F0C060; --warn-bg:#3A2E12; --bad:#F07A62; --bad-bg:#3D1F19;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#161514; --surface:#201E1C; --ink:#ECE7DF; --muted:#A79F94; --line:#38332D; --soft:#2A2724;
  --pri:#F0A06A; --pri-ink:#1A1410; --pri-soft:#43301F; --ok:#8CC06A; --ok-ink:#10200A; --warn:#F0C060; --warn-bg:#3A2E12; --bad:#F07A62; --bad-bg:#3D1F19;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background-color:var(--bg);background-image:var(--bg-img,none);background-size:var(--bg-size,auto);background-attachment:fixed;color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans','Helvetica Neue',Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.grow{flex:1;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
[hidden]{display:none!important}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 8px;transition:box-shadow .2s}
header.top.sc{box-shadow:0 1px 0 var(--line)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hrow .icons{display:flex;gap:2px}
h1{margin:0;font-size:1.75rem;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.icon{border:0;background:transparent;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.icon:hover{background:var(--soft)}
.icon svg{width:24px;height:24px}

main#view.wrap{padding-bottom:calc(var(--navh,80px) + 32px)}
h2{font-size:1.02rem;margin:20px 0 8px;color:var(--muted)}
.card{background:var(--surface);border-radius:16px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--line)}
.card h3{margin:0 0 8px;font-size:1rem}
.btn{border:0;border-radius:12px;padding:10px 16px;min-height:44px;font-weight:600;background:var(--pri);color:var(--pri-ink)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.warn{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.88rem;border-radius:10px}
.btn.add{width:100%;margin:4px 0 10px}
.link{border:0;background:none;color:var(--pri);font-weight:600;padding:0;text-align:left}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.9rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);font-weight:600}
.chip small{opacity:.75;margin-left:4px}
.seg{display:flex;gap:4px;overflow-x:auto;margin:2px 0 12px;padding:4px;background:var(--soft);border-radius:12px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;font-size:.84rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
label.f,div.f{display:block;margin-bottom:10px}
label.f>span,div.f>span{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:1rem;min-height:44px}
textarea{min-height:96px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;gap:10px;margin:4px 0 12px;font-weight:500}
.toggle input{width:22px;height:22px;accent-color:var(--pri);flex:none}
.empty{color:var(--muted);line-height:1.6;margin:18px 2px}
.empty strong{display:block;color:var(--ink);font-size:1.15rem;margin-bottom:4px}
.tag{display:inline-block;font-size:.76rem;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--soft);color:var(--muted)}
.tag.ok{color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.sum{margin:0 0 10px;color:var(--muted);font-size:.95rem}
.sum b{color:var(--ink)}

.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 14px;margin-bottom:8px;color:var(--ink)}
.item .grow b{display:block;font-weight:600}
.item .sub{display:block;font-size:.85rem;color:var(--muted)}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none;background:var(--soft)}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin:6px 0 10px}
.ph figure{position:relative;margin:0}
.ph img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--soft)}
.ph .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-weight:700;line-height:28px;padding:0}
.lines{margin:4px 0 8px}
.pline{display:grid;grid-template-columns:1fr 64px 80px 36px;gap:6px;margin-bottom:6px;align-items:center}
.pline input{min-height:40px;padding:8px}
.pline .x{border:0;background:var(--soft);border-radius:10px;height:40px;font-weight:700;color:var(--muted)}
.plhead{display:grid;grid-template-columns:1fr 64px 80px 36px;gap:6px;font-size:.76rem;font-weight:600;color:var(--muted);margin-bottom:2px}
.total{display:flex;justify-content:space-between;font-weight:700;margin:6px 0 12px}
table.pt{width:100%;border-collapse:collapse;font-size:.92rem;margin:4px 0 8px}
table.pt td{padding:5px 0;border-top:1px solid var(--line)}
table.pt td.n{text-align:right;white-space:nowrap;padding-left:10px}
.pre{white-space:pre-wrap}
ol.steps{margin:6px 0 12px;padding-left:22px}
ol.steps li{margin-bottom:6px}
.ms{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.ms:first-child{border-top:0}
.ms .d{flex:none;width:76px;font-size:.84rem;color:var(--muted);padding-top:2px}
.ms .x{border:0;background:none;color:var(--muted);font-weight:700;padding:0 4px}
.stl{display:flex;align-items:center;gap:9px;margin:7px 0;font-size:.92rem}
.stl i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--ok)}
.stl.warn i{background:var(--warn)}
.stl.bad i{background:var(--bad)}
.res h2{margin-top:16px}
.cover{display:block;width:100%;height:190px;object-fit:cover;border-radius:12px;background:var(--soft)}
.ptitle{margin:10px 0 2px;font-size:1.35rem;color:var(--ink)}
.bar{display:block;height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin:2px 0 8px}
.bar span{display:block;height:100%;background:var(--ok)}
.thumb.sm{width:40px;height:40px;border-radius:8px}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.tchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:.88rem;background:var(--surface)}
.tchip .link{font-weight:600;color:var(--ink)}
.tchip small{color:var(--muted)}
.tchip.have{border-color:var(--ok)}.tchip.have small{color:var(--ok);font-weight:700}
.tchip.missing,.tchip.buy{border-style:dashed;border-color:var(--warn)}.tchip.missing small,.tchip.buy small{color:var(--warn)}
.tchip.out small{color:var(--bad)}
.tchip .x{border:0;background:none;color:var(--muted);font-weight:700;padding:0 0 0 4px}
.prow{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.chk{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:var(--surface);color:var(--ok-ink);display:grid;place-items:center;padding:0}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.chk svg{width:18px;height:18px}
.ptxt{flex:1;min-width:0;border:0;background:none;text-align:left;padding:3px 0;color:var(--ink)}
.ptxt b{display:block;font-weight:600}
.ptxt .sub{display:block;font-size:.84rem;color:var(--muted)}
.prow.done .ptxt b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}

.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th{border:2px solid var(--line);border-radius:14px;padding:6px 6px 8px;background:var(--surface);color:var(--ink);font-size:.78rem;font-weight:600;line-height:1.25;text-align:center}
.th[aria-pressed="true"]{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-soft)}
.th .pv{display:block;position:relative;height:58px;border-radius:9px;margin-bottom:6px;overflow:hidden;border:1px solid rgba(127,127,127,.25)}
.th .pv i{position:absolute;left:6px;right:6px;top:6px;height:14px;border-radius:5px}
.th .pv b{position:absolute;left:6px;right:6px;top:25px;bottom:6px;border-radius:5px}
.th .pv u{position:absolute;right:5px;top:50%;width:16px;height:9px;margin-top:-4.5px;border-radius:5px}
.sph{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.sph img{aspect-ratio:4/3}
.step .simg img{display:block;max-width:100%;max-height:42vh;margin:14px auto 0;border-radius:12px;object-fit:contain}
.box{border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:.94rem}
.box.warn{background:var(--warn-bg)}
.box.warn b{color:var(--warn)}
.box.soft{background:var(--soft)}
.tip{display:block;font-size:.88rem;color:var(--muted);margin-top:2px}
.step .stip{margin-top:18px;font-size:1.05rem;line-height:1.45;background:var(--soft);border-radius:12px;padding:10px 12px}

/* nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-bottom:max(env(safe-area-inset-bottom,0px),6px)}
nav.bottom .wrap{display:flex;padding:0 2px}
nav.bottom button{flex:1 1 auto;min-width:0;border:0;background:transparent;padding:8px 1px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;font-weight:600;letter-spacing:-.01em;color:var(--muted)}
nav.bottom button span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.bottom svg{width:52px;height:30px;padding:3px 0;border-radius:999px;transition:background .2s}
nav.bottom button[aria-current="page"]{color:var(--pri)}
nav.bottom button[aria-current="page"] svg{background:var(--pri-soft)}

dialog.sheet{margin:auto auto 0;width:min(680px,100%);max-width:100%;max-height:90vh;max-height:90dvh;overscroll-behavior:contain;border:0;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));background:var(--surface);color:var(--ink);overflow:auto}
dialog.sheet::backdrop{background:rgba(0,0,0,.45)}
dialog.sheet h3{margin:0 0 12px;font-size:1.25rem}
dialog.sheet h3:focus{outline:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
dialog.sheet > .actions:last-child{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--surface);margin:10px -18px calc(-18px - env(safe-area-inset-bottom,0px));padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);z-index:1}

/* φωτογραφία σε όλη την οθόνη */
.pv{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;padding:12px}
.pv.on{display:flex}
.pv img{max-width:100%;max-height:100%;object-fit:contain}
.pv button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px}
/* οδηγός βήμα βήμα */
.step{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px))}
.step.on{display:flex}
.step .stop{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:720px;margin:0 auto;width:100%}
.step .sbody{flex:1;overflow:auto;max-width:720px;margin:20px auto;width:100%}
.step .stext{font-size:1.45rem;line-height:1.45;font-weight:500;white-space:pre-wrap}
.step .snav{display:flex;gap:10px;max-width:720px;margin:0 auto;width:100%}
.step .snav button{flex:1;padding:16px;font-size:1.05rem}

.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(var(--navh,80px) + 12px);z-index:70;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 32px);font-size:.92rem;display:flex;gap:14px;align-items:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{border:0;background:none;color:var(--pri-soft);font-weight:800;padding:0}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="hrow"><h1 id="title">Οδηγοί</h1><div class="icons">
    <button class="icon" type="button" data-a="go" data-tab="search" aria-label="Αναζήτηση"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
    <button class="icon" type="button" data-a="go" data-tab="settings" aria-label="Ρυθμίσεις"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div></div>
</div></header>

<main class="wrap" id="view"></main>

<nav class="bottom" aria-label="Ενότητες"><div class="wrap" id="nav">
  <button type="button" data-a="go" data-tab="guides"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg><span>Οδηγοί</span></button>
  <button type="button" data-a="go" data-tab="projects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M9 14l2 2 4-4"/></svg><span>Τα έργα μου</span></button>
  <button type="button" data-a="go" data-tab="tools"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/></svg><span>Εργαλεία</span></button>
</div></nav>

<div class="step" id="step">
  <div class="stop"><b id="stTitle"></b><button class="btn ghost sm" type="button" data-a="stepClose">Κλείσιμο</button></div>
  <div class="sbody"><div class="muted" id="stNum" style="font-weight:600;margin-bottom:8px"></div><div class="stext" id="stText"></div><div class="stip" id="stTip" hidden></div><div class="simg" id="stImg"></div><div class="row" style="margin-top:14px"><button class="btn ghost sm" type="button" id="stCam" data-a="stepCam" hidden>📷 Φωτογραφία βήματος</button></div></div>
  <div class="snav"><button class="btn ghost" type="button" data-a="stepPrev" id="stPrev">Πίσω</button><button class="btn" type="button" data-a="stepNext" id="stNext">Επόμενο</button></div>
</div>
<div class="pv" id="pv" data-a="pvClose"><img id="pvImg" alt=""><button class="btn ghost sm" type="button" data-a="pvClose">Κλείσιμο</button></div>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileGal" accept="image/*" multiple hidden>

<dialog class="sheet" id="sheet"></dialog>
<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button type="button" id="toastUndo">Αναίρεση</button></div>
<script>
"use strict";
/* ============ βοηθητικά ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ς/g,'σ').replace(/\s+/g,' ').trim();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>dstr(new Date());
const pd=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d);};
const diff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const DOW3=['Κυρ','Δευ','Τρί','Τετ','Πέμ','Παρ','Σάβ'];
/* Ημερομηνία: φέτος «Δευ 26/10», παλιότερα «26/10/2025». */
const dFmt=s=>{if(!s)return '';const d=pd(s);return d.getFullYear()===new Date().getFullYear()?`${DOW3[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}`:`${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;};
const rel=s=>{const n=diff(today(),s);if(n===0)return 'σήμερα';if(n===-1)return 'χθες';if(n===1)return 'αύριο';if(n<0&&n>-60)return `πριν ${-n} μέρες`;return dFmt(s);};
const plural=(n,a,b)=>n===1?a:b;
const EURF=new Intl.NumberFormat('el-GR',{style:'currency',currency:'EUR'}),eur=n=>EURF.format(Number(n)||0);
const fmtN=n=>Number(n||0).toLocaleString('el-GR',{maximumFractionDigits:2});
/* Ποσά/ποσότητες με κόμμα ή τελεία: «12,50», «12.5», «1.234,50», «€ 3». null αν δεν είναι αριθμός. */
function parseAmt(s){if(s==null)return null;let t=String(s).trim().replace(/€|\s/g,'');if(!t)return null;
  if(t.includes(',')&&t.includes('.')){if(t.lastIndexOf(',')>t.lastIndexOf('.'))t=t.replace(/\./g,'').replace(',','.');else t=t.replace(/,/g,'');}else t=t.replace(',','.');
  const n=Number(t);return isFinite(n)?Math.round(n*100)/100:null;}
const amtIn=n=>n==null||n===''?'':String(n).replace('.',',');

/* ============ αποθήκευση ============ */
const KEY='mastoremata.v1';
const NB=window.AndroidBridge||null;
const DEF=()=>({v:2,projects:{},guides:{},tools:{},hiddenLib:{},
  settings:{theme:'auto',autoBackup:false,lastBackup:null,lastAutoBackup:null,lastOffsite:null,updChecked:null,lastVer:''}});
/* kind στη βάση → πεδίο του D. Τα παλιά kinds (repair, skill, part, done) διαβάζονται μόνο για τη μετατροπή (migrate). */
const KINDS={project:'projects',guide:'guides',tool:'tools'};
const KV=['settings','hiddenLib','v'];
function fromRecords(rec){const d=DEF();d._old={};
  for(const [kind,map] of Object.entries(rec||{}))for(const [id,v] of Object.entries(map||{})){
    if(KINDS[kind])d[KINDS[kind]][id]=v;else if(kind==='kv'){if(KV.includes(id))d[id]=v;}else if(kind!=='hist')(d._old[kind]=d._old[kind]||{})[id]=v;}
  return d;}
function toRecords(d){const m=new Map(),put=(k,id,v,day)=>m.set(k+'\u0001'+id,{kind:k,id:String(id),day:day||null,data:JSON.stringify(v)});
  for(const [k,f] of Object.entries(KINDS))for(const [id,v] of Object.entries(d[f]||{}))put(k,id,v,k==='project'?(v.finished||v.started||null):null);
  for(const k of KV)put('kv',k,d[k]);return m;}
/* lastRec: ό,τι είναι τώρα στη βάση (για τις διαφορές). Στο Android ξεκινά από την ίδια τη βάση, ώστε να σβηστούν οι παλιές εγγραφές. */
let lastRec=new Map(),loadOk=false;
function loadData(){if(NB){try{const rec=JSON.parse(NB.loadAll()||'{}');
      for(const [kind,map] of Object.entries(rec))if(kind!=='hist')for(const [id,v] of Object.entries(map||{}))lastRec.set(kind+'\u0001'+id,{kind,id,day:null,data:JSON.stringify(v)});
      H=Object.values(rec.hist||{}).filter(h=>h&&h.id&&Array.isArray(h.inv)).sort((a,b)=>a.at-b.at);loadOk=true;return fromRecords(rec);}catch(e){return DEF();}}
  try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');H=JSON.parse(localStorage.getItem(HKEY)||'[]');loadOk=true;
    const d=Object.assign(DEF(),raw||{});d._old={repair:raw&&raw.repairs};return d;}catch(e){return DEF();}}
const PST={idea:['Ιδέα','☆'],progress:['Σε εξέλιξη','▶'],paused:['Σε παύση','⏸'],done:['Ολοκληρώθηκε','✓']};
const PSH={idea:'Ιδέα',progress:'Σε εξέλιξη',paused:'Παύση',done:'Έγινε'};
/* Μετατροπή: επισκευές → έργα, παλιοί δικοί μου οδηγοί → νέα πεδία, «σιλικόνες» → «τοίχοι». */
function migrate(d){d.settings=Object.assign(DEF().settings,d.settings||{});d.settings.theme=({kitchen:'workshop',spice:'copper'})[d.settings.theme]||d.settings.theme;
  for(const f of Object.values(KINDS).concat(['hiddenLib']))if(!d[f]||typeof d[f]!=='object')d[f]={};
  const old=(d._old&&d._old.repair)||{};delete d._old;
  for(const r of Object.values(old)){if(!r||!r.id||d.projects[r.id])continue;const ph=(r.photos||[]).slice();
    const mat=(r.parts||[]).map(l=>`${l.name}${(+l.qty||1)!==1?' ×'+fmtN(l.qty):''}${l.price!=null&&l.price!==''?' ('+eur((+l.qty||1)*l.price)+')':''}`).concat(+r.extra?[`Άλλα έξοδα: ${eur(r.extra)}`]:[]).join('\n');
    d.projects[r.id]={id:r.id,title:r.title||'Επισκευή',cat:guessCat((r.title||'')+' '+(r.how||'')),desc:r.how||'',cover:ph[0]||'',tools:[],materials:mat,
      status:r.status==='open'?'progress':'done',guide:r.guide||'',steps:ph.length>1?[{id:uid(),t:'Φωτογραφίες',tip:'',done:true,d:r.d,note:'',photos:ph.slice(1)}]:[],
      created:r.created||Date.now(),started:r.d||null,finished:r.status==='open'?null:(r.d||null),rating:0,notes:''};}
  for(const g of Object.values(d.guides)){if(g.cat==='seal')g.cat='wall';if(!Array.isArray(g.tools)){g.tools=[];if(g.need&&!g.materials)g.materials=g.need;delete g.need;}}
  for(const p of Object.values(d.projects)){if(!Array.isArray(p.steps))p.steps=[];if(!Array.isArray(p.tools))p.tools=[];if(!PST[p.status])p.status='progress';if(p.cat==='seal')p.cat='wall';
    for(const s of p.steps){if(!Array.isArray(s.photos))s.photos=[];if(!s.id)s.id=uid();}}
  for(const k of ['repairs','skills','parts','done'])delete d[k];if(d.v!==2)d.v=2;return d;}
let D=null,storageWarned=false;

/* ============ πρόσφατες αλλαγές (αναίρεση έως 24 ώρες) ============
   Κάθε αποθήκευση με ετικέτα (commit(ετικέτα)) κρατά τις ΠΡΟΗΓΟΥΜΕΝΕΣ τιμές των εγγραφών που άλλαξαν (inv).
   Αναίρεση = επαναφορά αυτών των εγγραφών· νεότερες αλλαγές στις ίδιες εγγραφές φεύγουν από τη λίστα. Η ίδια η αναίρεση
   γράφεται κι αυτή (ξανα-αναιρείται). Στο Android στη βάση ως kind 'hist', στον browser στο localStorage. */
const HKEY='mastoremata.hist',H_MS=24*3600e3;
let H=[],histGone=[],pendingLabel=null;
const histable=r=>!(r.kind==='kv'&&(r.id==='settings'||r.id==='v'));
function persist(){const cur=toRecords(D),ops=[],inv=[],now=Date.now();
  for(const [k,r] of cur){const o=lastRec.get(k);if(!o||o.data!==r.data){ops.push(Object.assign({op:'put'},r));if(histable(r))inv.push({kind:r.kind,id:r.id,data:o?o.data:null});}}
  for(const [k,r] of lastRec)if(!cur.has(k)){ops.push({op:'del',kind:r.kind,id:r.id});if(histable(r)&&KINDS[r.kind])inv.push({kind:r.kind,id:r.id,data:r.data});}
  const hist=pendingLabel&&inv.length?{id:uid(),at:now,label:pendingLabel,inv}:null;pendingLabel=null;
  const old=H.filter(h=>now-h.at>H_MS);histGone.push(...old.map(h=>h.id));H=H.filter(h=>now-h.at<=H_MS);if(hist)H.push(hist);
  if(NB){const all=ops.concat(hist?[{op:'put',kind:'hist',id:hist.id,day:null,data:JSON.stringify(hist)}]:[],histGone.map(id=>({op:'del',kind:'hist',id})));
    if(all.length&&!NB.applyOps(JSON.stringify(all)))throw new Error('db');}
  else{localStorage.setItem(KEY,JSON.stringify(D));try{localStorage.setItem(HKEY,JSON.stringify(H));}catch(e){}}
  histGone=[];lastRec=cur;return hist;}
function save(label){pendingLabel=label||null;try{return persist();}catch(e){if(!storageWarned){storageWarned=true;toast(NB?'Σφάλμα αποθήκευσης στη βάση. Κράτα αντίγραφο από τις Ρυθμίσεις.':'Ο browser δεν αποθηκεύει τα δεδομένα. Κράτα αντίγραφο από τις Ρυθμίσεις.');}return null;}}
/* commit(ετικέτα) = αποθήκευση + οθόνη· επιστρέφει την καταγραφή για αναίρεση. done(μήνυμα, ετικέτα): και μήνυμα με «Αναίρεση». */
function commit(label){const h=save(label);render();return h;}
function done(msg,label){const h=commit(label||msg);toast(msg,h?()=>undoHist(h.id):null);return h;}
function undoHist(hid){const i=H.findIndex(h=>h.id===hid);if(i<0){toast('Η αλλαγή δεν υπάρχει πια');return;}const h=H[i],keys=new Set(h.inv.map(x=>x.kind+'\u0001'+x.id));
  const m=new Map(lastRec);for(const x of h.inv){const k=x.kind+'\u0001'+x.id;if(x.data==null)m.delete(k);else m.set(k,{kind:x.kind,id:x.id,day:null,data:x.data});}
  const gone=[h.id].concat(H.slice(i+1).filter(e=>e.inv.some(x=>keys.has(x.kind+'\u0001'+x.id))).map(e=>e.id));
  H=H.filter(e=>!gone.includes(e.id));histGone.push(...gone);
  const rec={};for(const r of m.values()){try{(rec[r.kind]=rec[r.kind]||{})[r.id]=JSON.parse(r.data);}catch(e){}}
  const s=D.settings;D=migrate(fromRecords(rec));D.settings=s;
  if(ui.pid&&!D.projects[ui.pid])ui.pid=null;closeSheet();applyTheme();
  const nh=commit('Αναίρεση: '+h.label);toast('Αναιρέθηκε: '+h.label,nh?()=>undoHist(nh.id):null);}
const hTime=at=>{const d=new Date(at),t=pad(d.getHours())+':'+pad(d.getMinutes());return dstr(d)===today()?t:'χθες '+t;};

let ui=Object.assign({tab:'guides',pid:null,pSt:'progress',gCat:'',toolCond:''},(()=>{try{return JSON.parse(localStorage.getItem('mastoremata.ui')||'{}');}catch(e){return{};}})());
if(!['guides','projects','tools','settings'].includes(ui.tab))ui.tab='guides';
const saveUi=()=>{try{localStorage.setItem('mastoremata.ui',JSON.stringify(ui));}catch(e){}};

/* ============ φωτογραφίες ============ */
/* Στο Android είναι αρχεία της εφαρμογής (Photos.kt) και οι εγγραφές κρατούν το όνομα. Στον browser: μικρές
   εικόνες (data URL) στο localStorage, μόνο για δοκιμή. */
const PKEY='mastoremata.photos';
let LP=null;const localPhotos=()=>{if(!LP){try{LP=JSON.parse(localStorage.getItem(PKEY)||'{}');}catch(e){LP={};}}return LP;};
const photoSrc=n=>{if(NB){try{return NB.photoUrl(n)||'';}catch(e){return '';}}return localPhotos()[n]||'';};
const imgTag=(n,cls)=>{const s=photoSrc(n);return s?`<img class="${cls||''}" src="${esc(s)}" alt="" loading="lazy">`:`<span class="${cls||''}" style="display:grid;place-items:center">📷</span>`;};
const phGrid=(list,del)=>list&&list.length?`<div class="ph">${list.map((n,i)=>`<figure><button class="link" type="button" data-a="photoShow" data-n="${esc(n)}" style="display:block;width:100%">${imgTag(n)}</button>${del?`<button class="x" type="button" data-a="${del}" data-i="${i}" aria-label="Αφαίρεση φωτογραφίας">×</button>`:''}</figure>`).join('')}</div>`:'';
/* Όλες οι φωτογραφίες που αναφέρονται (έργα, οδηγοί, και όσες χρειάζονται για αναίρεση) — για να μη σβηστούν. */
function photoRefs(d,hist){const s=new Set(),txt=JSON.stringify([d&&d.projects,d&&d.guides,hist||[]]);for(const m of txt.matchAll(/p-[A-Za-z0-9_-]{1,60}\.jpg/g))s.add(m[0]);return s;}
/* Η JS λέει στο Android ποιες φωτογραφίες χρειάζονται· οι υπόλοιπες σβήνονται. Μόνο αν φόρτωσαν σωστά τα δεδομένα. */
function prunePhotos(){if(!NB||typeof NB.prunePhotos!=='function'||!loadOk||(!Object.keys(D.projects).length&&!Object.keys(D.guides).length&&!H.length))return;
  try{NB.prunePhotos(JSON.stringify([...photoRefs(D,H)]));}catch(e){}}
function fileToJpeg(f){return new Promise(res=>{const r=new FileReader();r.onerror=()=>res(null);r.onload=()=>{const img=new Image();img.onerror=()=>res(null);
  img.onload=()=>{try{const s=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8));}catch(e){res(r.result);}};img.src=r.result;};r.readAsDataURL(f);});}
async function browserPhotos(files){const out=[],lp=localPhotos();for(const f of files){const u=await fileToJpeg(f);if(!u)continue;const n='p-'+uid()+'.jpg';lp[n]=u;out.push(n);}
  try{localStorage.setItem(PKEY,JSON.stringify(lp));}catch(e){toast('Ο browser δεν χωράει άλλες φωτογραφίες.');}
  window.__onPhotos(out);}
/* Πού πάει η φωτογραφία: {to:'cover'|'step'|'log'|'form', pid, sid, text}. Κρατιέται και στο localStorage, γιατί το Android
   μπορεί να κλείσει την εφαρμογή όσο είναι ανοιχτή η κάμερα. */
const PTKEY='mastoremata.photoTarget';
function photoFor(target,cam){try{localStorage.setItem(PTKEY,JSON.stringify(target));}catch(e){}
  if(cam){if(NB)NB.takePhoto();else{const i=$('#fileCam');i.value='';i.click();}}else{if(NB)NB.pickPhotos();else{const i=$('#fileGal');i.value='';i.click();}}}
window.__onPhotos=list=>{list=(list||[]).filter(Boolean);let t=null;try{t=JSON.parse(localStorage.getItem(PTKEY)||'null');localStorage.removeItem(PTKEY);}catch(e){}
  if(!list.length)return;const many=list.length>1?`${list.length} φωτογραφίες`:'Η φωτογραφία';
  if(t&&t.to==='form'&&sheet.open&&$('#gSteps')){/* Φόρμα οδηγού: γραμμή «📷 όνομα» κάτω από τη γραμμή του δρομέα. */
    const ta=$('#gSteps'),v=ta.value,pos=Math.min(ta.selectionStart==null?v.length:ta.selectionStart,v.length);let e=v.indexOf('\n',pos);if(e<0)e=v.length;
    ta.value=v.slice(0,e)+(e>0?'\n':'')+list.map(n=>'📷 '+n).join('\n')+v.slice(e);toast('Η φωτογραφία μπήκε κάτω από το βήμα');return;}
  let p=t&&t.pid&&D.projects[t.pid];
  if(!p){/* Χωρίς στόχο: στο ανοιχτό έργο, αλλιώς νέα ιδέα με αυτή τη φωτογραφία. */
    p=ui.tab==='projects'&&ui.pid&&D.projects[ui.pid];if(!p){const id=uid();p=D.projects[id]={id,title:'Νέο έργο',cat:'other',desc:'',cover:list[0],tools:[],materials:'',status:'idea',steps:[],created:Date.now()};list=list.slice(1);ui.tab='projects';ui.pid=id;
      if(!list.length){done('Νέο έργο με τη φωτογραφία','Νέο έργο');return;}}t={to:'log'};}
  if(t.to==='cover'){p.cover=list[0];if(list.length>1)p.steps.push({id:uid(),t:'Φωτογραφίες',tip:'',done:true,d:today(),note:'',photos:list.slice(1)});done('Η φωτογραφία του έργου άλλαξε','Φωτογραφία: '+p.title);}
  else if(t.to==='step'&&p.steps.find(s=>s.id===t.sid)){const s=p.steps.find(s=>s.id===t.sid);s.photos=(s.photos||[]).concat(list);done(`${many} μπήκε στο βήμα`,'Φωτογραφία: '+p.title);if(sheet.open&&$('#sPhotos'))stepSheet(p.id,s.id);if(stp)stepDraw();}
  else{p.steps.push({id:uid(),t:(t.text||'').trim()||'Φωτογραφία',tip:'',done:true,d:today(),note:'',photos:list});if(p.status==='idea'){p.status='progress';p.started=p.started||today();}
    const inp=$('#logText');if(inp)inp.value='';done('Το βήμα καταγράφηκε με '+(list.length>1?`${list.length} φωτογραφίες`:'φωτογραφία'),'Βήμα: '+p.title);}};
function showPhoto(n){const s=photoSrc(n);if(!s)return;$('#pvImg').src=s;$('#pv').classList.add('on');}
function closePhoto(){$('#pv').classList.remove('on');$('#pvImg').removeAttribute('src');}

function toast(msg,undo){const t=$('#toast');$('#toastMsg').textContent=msg;const u=$('#toastUndo');u.style.display=undo?'':'none';
  u.onclick=()=>{t.classList.remove('show');undo&&undo();};t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),undo?6000:2600);}
const sheet=$('#sheet');

const segBtns=(g,opts,cur)=>`<div class="seg" data-g="${g}">${opts.map(([v,l])=>`<button type="button" data-a="segPick" data-v="${v}" aria-pressed="${v===cur}">${l}</button>`).join('')}</div>`;

/* ============ ΚΑΤΗΓΟΡΙΕΣ / ΕΡΓΑΛΕΙΑ ΠΟΥ ΧΡΕΙΑΖΟΝΤΑΙ ============ */
const GCAT={plumb:['🚰','Υδραυλικά'],elec:['⚡','Ηλεκτρολογικά'],wall:['🧱','Τοίχοι, βάψιμο & μονώσεις'],wood:['🪚','Ξυλουργικά & κατασκευές'],
  garden:['🌱','Κήπος & εξωτερικοί χώροι'],ride:['🚲','Αυτοκίνητο & ποδήλατο'],appl:['🔌','Συσκευές & ηλεκτρονικά'],music:['🎸','Μουσικά όργανα'],
  tools:['🧰','Φροντίδα εργαλείων'],other:['📌','Άλλα']};
const LEVEL=['','Εύκολο','Μέτριο','Δύσκολο'];
const lvlTag=l=>l?`<span class="tag ${l>=3?'bad':l===2?'warn':'ok'}">${'●'.repeat(l)}${'○'.repeat(3-l)} ${LEVEL[l]}</span>`:'';
const catOf=x=>GCAT[(x&&x.cat)||'other']||GCAT.other;
const catOpts=cur=>Object.entries(GCAT).map(([k,c])=>`<option value="${k}"${k===(cur||'other')?' selected':''}>${c[0]} ${c[1]}</option>`).join('');
/* Ένα εργαλείο που χρειάζεται ↔ τα «Εργαλεία» μου: ίδιο όνομα, ή το ένα αρχή του άλλου (π.χ. «Δράπανο» ↔ «Δράπανο μπαταρίας»). */
function toolMatch(name){const n=norm(name);if(!n)return null;const T=Object.values(D.tools);
  return T.find(t=>norm(t.name)===n)||T.find(t=>{const m=norm(t.name);return m&&(m.startsWith(n+' ')||n.startsWith(m+' '));})||null;}
/* have: το έχω · out: το έχω αλλά χαλασμένο/δανεισμένο · buy: σημειωμένο «να αγοράσω» · missing: δεν το έχω γράψει */
function toolState(name){const t=toolMatch(name);if(!t)return{st:'missing',t:null};if(t.cond==='buy')return{st:'buy',t};if(t.cond==='broken'||t.cond==='lent')return{st:'out',t};return{st:'have',t};}
/* Λίστα «Χρειάζεται» με ✓ / λείπει. del: όνομα ενέργειας αφαίρεσης (στα έργα). */
function toolChips(list,del){if(!list||!list.length)return '';return `<div class="tchips">${list.map((n,i)=>{const {st,t}=toolState(n);
  const lab=st==='have'?'✓':st==='out'?(t.cond==='lent'?'δανεισμένο':'χαλασμένο'):st==='buy'?'🛒 να αγοράσω':'λείπει';
  const nm=t?`<button class="link" type="button" data-a="toolOpen" data-id="${t.id}">${esc(n)}</button>`:esc(n);
  const add=st==='missing'?` <button class="link" type="button" data-a="toolBuy" data-n="${esc(n)}">+ να αγοράσω</button>`:'';
  return `<span class="tchip ${st}">${nm} <small>${lab}</small>${add}${del?`<button class="x" type="button" data-a="${del}" data-i="${i}" aria-label="Αφαίρεση">×</button>`:''}</span>`;}).join('')}</div>`;}
const toolsHave=list=>(list||[]).filter(n=>toolState(n).st==='have').length;
const allToolNames=()=>[...new Set(Object.values(D.tools).map(t=>t.name).concat(...LIB.map(g=>g.tools||[])))];
const splitTools=s=>String(s||'').split(/[,\n;]/).map(x=>x.trim()).filter(Boolean);

/* ============ ΕΤΟΙΜΟΙ ΟΔΗΓΟΙ ============
   ids `b-…`: ΓΡΑΜΜΕΝΟΙ ΓΙΑ ΤΗΝ ΕΦΑΡΜΟΓΗ, γενικές και συντηρητικές οδηγίες. Μην αντιγράφεις κείμενα από sites εδώ· ο χρήστης
   φέρνει όποιον οδηγό θέλει με «Επικόλληση» ή σύνδεσμο. tools: ονόματα εργαλείων (ταιριάζουν με τα «Εργαλεία» μου, `toolHave`),
   materials: υλικά (ελεύθερο κείμενο). Γραμμή βήματος που αρχίζει με «>» = συμβουλή/«γιατί» για το από πάνω βήμα.
   level: 1 εύκολο, 2 μέτριο, 3 δύσκολο. */

    if(mode==='safety'){out.safety.push(l.replace(PZ_BUL,''));return;}

    steps:out.steps.filter(s=>s.t).map(s=>s.t+(s.tip.length?'\n> '+s.tip.join(' '):'')+s.img.map(x=>'\n'+x).join('')).join('\n')};}
const CAT_WORDS={plumb:/βρυσ|σιφων|λεκαν|καζανακ|υδραυλ|σωλην|αποχετευσ|μπαταρια (κουζινασ|μπανιου)|θερμοσιφ|ντουσ|faucet|sink|toilet|plumb|drain|pipe/,elec:/πριζ|διακοπτ|καλωδι|ηλεκτρ|ασφαλει|ρελε|φωτιστικ|λαμπ|outlet|socket|light switch|wiring|breaker/,
  wood:/ξυλ|ντουλαπ|μεντεσ|συρταρ|ραφι|επιπλ|πορτα|καρεκλ|τραπεζ|hinge|drawer|cabinet|shelf|wood|furniture/,wall:/τοιχ|βαψ|στοκ|χρωμα|σοβα|ταβαν|σιλικον|αρμο|μονωσ|υγρασι|μουχλ|drywall|paint|plaster|caulk|silicone|grout/,
  garden:/κηπ|γλαστρ|φυτ|ποτισ|σταγον|γκαζον|ψησταρ|μπαλκον|garden|plant|lawn|irrigat|grill/,music:/κιθαρ|χορδ|ταστ|μπρατσ|ενισχυτ|οργαν|guitar|string|fret|truss|bass|amp/,
  appl:/πλυντηρ|ψυγει|κλιματιστ|φουρν|απορροφητηρ|συσκευ|κολλητηρ|πολυμετρ|washer|dryer|dishwasher|fridge|refrigerator|oven|vacuum|appliance|phone|laptop|console|solder/,ride:/αυτοκινητ|ελαστικ|ποδηλατ|σαμπρελ|μηχανακ|λαδια μηχανησ|bike|bicycle|tire|tyre|\bcar\b|scooter/,tools:/σκουρι|ακονισ|σμιλ|rust|sharpen|chisel/};

/* Κείμενο του άρθρου ως γραμμές (επικεφαλίδες, παράγραφοι, «1.» για αριθμημένες λίστες) + φωτογραφίες ως «📷 #αριθμός». */

function newerVer(a,b){const x=String(a).split('.').map(n=>parseInt(n)||0),y=String(b).split('.').map(n=>parseInt(n)||0);

  else if(updManual)toast('Δεν βρέθηκε έκδοση. Έχεις σύνδεση στο internet;');

  if(updGo){updGo=false;const t=j&&j.version?upd:prev;if(t){toast(`Λήψη της έκδοσης ${t.version}…`);NB.installUpdate(t.url,t.version);}else toast('Έχεις ήδη την τελευταία έκδοση');}
  updManual=false;if(!sheet.open&&ui.tab==='settings')render();};
window.__onUpdateInstall=r=>{if(r==='started')toast('Εγκατάσταση… Η εφαρμογή θα κλείσει για λίγο· άνοιξέ τη ξανά από το εικονίδιο.');
  else if(r==='perm')openSheet(`<h3>Μία ρύθμιση, μόνο την πρώτη φορά</h3><p>Στην οθόνη που άνοιξε, άναψε το «Να επιτρέπεται από αυτή την πηγή». Μετά γύρνα εδώ και πάτα ξανά «Ενημέρωση».</p><div class="actions"><button class="btn grow" type="button" data-a="close">Εντάξει</button></div>`);
  else if(r==='aborted')openSheet(`<h3>Η ενημέρωση ακυρώθηκε</h3><p>Αν δεν την ακύρωσες εσύ, μάλλον τη μπλόκαρε ο <b>Αυτόματος αποκλεισμός</b> της Samsung. Κλείσ’ τον από Ρυθμίσεις → Ασφάλεια και απόρρητο → Αυτόματος αποκλεισμός και πάτα ξανά «Ενημέρωση».</p><div class="actions"><button class="btn grow" type="button" data-a="close">Εντάξει</button></div>`);
  else toast('Δεν έγινε η ενημέρωση: '+r);};
/* Μετά από ενημέρωση: ένα μήνυμα με τη νέα έκδοση (χωρίς ειδοποίηση του Android). */
function noteUpdated(){if(!NB)return;let v='';try{v=NB.appVersion();}catch(e){}if(!v)return;const was=D.settings.lastVer;
  if(was!==v){D.settings.lastVer=v;save();if(was&&newerVer(v,was)){upd=null;setTimeout(()=>toast(`Ενημερώθηκε στην έκδοση ${v}`),600);}}}

/* ============ οθόνες ============ */
const TITLES={guides:'Οδηγοί',projects:'Τα έργα μου',tools:'Εργαλεία',search:'Αναζήτηση',settings:'Ρυθμίσεις'};
const VIEWS={guides:vGuides,projects:()=>ui.pid&&P_(ui.pid)?vProject(P_(ui.pid)):vProjects(),tools:vTools,search:vSearch,settings:vSettings};
function render(){if(!VIEWS[ui.tab])ui.tab='guides';if(ui.pid&&!P_(ui.pid))ui.pid=null;
  $('#title').textContent=ui.tab==='projects'&&ui.pid?'Έργο':TITLES[ui.tab];
  document.querySelectorAll('#nav button').forEach(b=>{if(b.dataset.tab===ui.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  const y=window.scrollY;$('#view').innerHTML=VIEWS[ui.tab]();if(ui.tab==='projects'&&ui.pid)window.scrollTo({top:y});saveUi();}
function go(tab){if(tab===ui.tab){if(tab==='projects'&&ui.pid){ui.pid=null;render();window.scrollTo({top:0});}return;}
  if(ui.tab!=='search'&&ui.tab!=='settings')prevTab=ui.tab;ui.tab=tab;render();window.scrollTo({top:0});
  if(tab==='search')setTimeout(()=>{const q=$('#q');if(q)q.focus();},50);}
function openProject(id){closeSheet();if(stp)stepClose();ui.tab='projects';ui.pid=id;render();window.scrollTo({top:0});}

function refreshSheet(){if(sheet.open&&sheetGuide&&guideOf(sheetGuide))guideView(sheetGuide);}

 close:()=>closeSheet(),

 /* έργα */
 projNew:()=>projEdit(null),
 projEdit:el=>projEdit(el.dataset.id),

   if(id){const p=P_(id);if(!p)return;Object.assign(p,{title,cat:val('pCat')||'other',desc:val('pDesc')});touch(p);closeSheet();done('Αποθηκεύτηκε','Έργο: '+title);return;}

   else done('Μπήκε στις «Ιδέες» των έργων σου','Ιδέα: '+p.title);},
 projStatus:el=>{const p=pOf(el),v=el.dataset.v;if(!p||p.status===v)return;if(v==='done'){finishSheet(p.id);return;}
   p.status=v;if(v==='progress'&&!p.started)p.started=today();p.finished=null;touch(p);done(`«${p.title}»: ${PST[v][0]}`,`${PST[v][0]}: ${p.title}`);},
 projFinish:el=>finishSheet(el.dataset.id),
 finishSave:el=>{const p=pOf(el);if(!p)return;const r=+segVal('rate');if(!r){toast('Διάλεξε πόσο δύσκολο ήταν');return;}const was=p.status==='done';

   done(was?'Αποθηκεύτηκε':p.noGuide?'Το έργο ολοκληρώθηκε':'Ολοκληρώθηκε και μπήκε στους «Οδηγούς μου»',(was?'Βαθμός: ':'Ολοκλήρωση: ')+p.title);},
 projNoGuide:el=>{const p=pOf(el);if(!p)return;p.noGuide=true;touch(p);closeSheet();done('Δεν φαίνεται πια στους οδηγούς','Απόκρυψη από οδηγούς: '+p.title);},

 projCover:el=>photoFor({to:'cover',pid:el.dataset.id},!!el.dataset.cam),
 projToolAdd:()=>{const p=P_(ui.pid),n=val('ptTool');if(!p)return;if(!n){toast('Γράψε το εργαλείο');return;}if(p.tools.some(t=>norm(t)===norm(n))){toast('Υπάρχει ήδη');return;}
   p.tools.push(n);touch(p);done('Προστέθηκε: '+n,'Εργαλείο στο έργο: '+n);setTimeout(()=>{const i=$('#ptTool');if(i)i.focus();},30);},
 projToolDel:el=>{const p=P_(ui.pid);if(!p)return;const n=p.tools.splice(+el.dataset.i,1)[0];touch(p);done('Αφαιρέθηκε: '+n,'Εργαλείο εκτός έργου: '+n);},
 projLog:el=>{const p=P_((el&&el.dataset&&el.dataset.id)||ui.pid),t=val('logText');if(!p)return;if(!t){toast('Γράψε τι έκανες');return;}
   p.steps.push({id:uid(),t,tip:'',done:true,d:today(),note:'',photos:[]});if(p.status==='idea'||p.status==='paused'){p.status='progress';p.started=p.started||today();}touch(p);done('Το βήμα καταγράφηκε','Βήμα: '+t);},
 projPlan:el=>{const p=pOf(el),t=val('logText');if(!p)return;if(!t){toast('Γράψε το βήμα');return;}p.steps.push({id:uid(),t,tip:'',done:false,d:null,note:'',photos:[]});touch(p);done('Προστέθηκε βήμα για μετά','Βήμα για μετά: '+t);},
 projLogPhoto:el=>photoFor({to:'log',pid:el.dataset.id,text:val('logText')},!!el.dataset.cam),
 projStep:el=>stepOpen('project',el.dataset.id),
 stepToggle:el=>{const p=pOf(el),s=stepOf(p,el.dataset.sid);if(!s)return;s.done=!s.done;s.d=s.done?today():null;if(s.done&&(p.status==='idea'||p.status==='paused')){p.status='progress';p.started=p.started||today();}touch(p);
   const all=p.steps.every(x=>x.done);done(s.done?(all&&p.status!=='done'?'Όλα τα βήματα έγιναν! Πάτα «Ολοκλήρωση έργου»':'✓ '+s.t):'Ξανανοίχτηκε: '+s.t,(s.done?'✓ ':'○ ')+s.t);},
 stepOpen:el=>stepSheet(el.dataset.pid,el.dataset.sid),
 stepSave:el=>{const p=pOf(el),s=stepOf(p,el.dataset.sid);if(!s)return;s.t=val('sText')||s.t;s.note=val('sNote');const dn=$('#sDone').checked;if(dn!==!!s.done){s.done=dn;s.d=dn?(s.d||today()):null;}touch(p);closeSheet();done('Αποθηκεύτηκε','Βήμα: '+s.t);},
 stepDel:el=>{const p=pOf(el),s=stepOf(p,el.dataset.sid);if(!s)return;p.steps=p.steps.filter(x=>x!==s);touch(p);closeSheet();done('Το βήμα διαγράφηκε','Διαγραφή βήματος: '+s.t);},
 stepMove:el=>{const p=pOf(el),s=stepOf(p,el.dataset.sid);if(!s)return;const i=p.steps.indexOf(s),j=i+(+el.dataset.d);if(j<0||j>=p.steps.length)return;[p.steps[i],p.steps[j]]=[p.steps[j],p.steps[i]];touch(p);commit('Σειρά βημάτων: '+p.title);stepSheet(p.id,s.id);},
 stepPhoto:el=>photoFor({to:'step',pid:el.dataset.pid,sid:el.dataset.sid},!!el.dataset.cam),
 stepPhotoDel:el=>{const b=sheet.querySelector('[data-a="stepSave"]');if(!b)return;const p=P_(b.dataset.pid),s=stepOf(p,b.dataset.sid);if(!s)return;s.photos.splice(+el.dataset.i,1);touch(p);done('Η φωτογραφία αφαιρέθηκε','Φωτογραφία εκτός βήματος: '+s.t);stepSheet(p.id,s.id);},
 stepClose:()=>stepClose(),
 stepPrev:()=>{if(!stp)return;stp.i--;stepDraw();},
 stepNext:()=>{if(!stp)return;const L=stepScreens(),cur=L[stp.i];
   if(stp.kind==='project'&&cur&&cur.sid&&!cur.done){const p=P_(stp.id),s=stepOf(p,cur.sid);if(s){s.done=true;s.d=today();if(p.status==='idea'||p.status==='paused'){p.status='progress';p.started=p.started||today();}touch(p);save('✓ '+s.t);render();}}
   if(stp.i>=L.length-1){const k=stp.kind,id=stp.id;stepClose();if(k==='project'){const p=P_(id);if(p&&p.status!=='done'&&p.steps.every(s=>s.done))finishSheet(id);else if(p&&p.steps.some(s=>!s.done))toast('Έμειναν βήματα που δεν έγιναν');}else toast('Τέλος του οδηγού. Πάτα «▶ Ξεκίνα έργο» για να τον κάνεις!');return;}

   D=Object.assign(DEF(),{settings:D.settings});ui.pid=null;done('Όλα διαγράφηκαν','Διαγραφή όλων');},

/* πεδία (data-in, με κάθε πληκτρολόγηση) */
let matT=null;
const I={
 q:el=>{searchQ=el.value;const r=$('#res');if(r)r.innerHTML=searchHtml();},

/* ============ Android ============ */
window.__back=()=>{if($('#pv').classList.contains('on')){closePhoto();return true;}if(stp){stepClose();return true;}if(sheet.open){closeSheet();return true;}
  if(ui.tab==='projects'&&ui.pid){ui.pid=null;render();window.scrollTo({top:0});return true;}
  if(ui.tab==='search'||ui.tab==='settings'){ui.tab=prevTab||'guides';render();window.scrollTo({top:0});return true;}return false;};
window.__resume=()=>{checkShared();setTimeout(()=>autoBackup(false),1500);setTimeout(()=>updCheck(false),2000);};

/* ============ σύνδεση ============ */
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;if(el.id==='pv'&&e.target!==el&&e.target.tagName!=='BUTTON')return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el,e);}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.in&&I[el.dataset.in])I[el.dataset.in](el,e);});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.ch&&C[el.dataset.ch])C[el.dataset.ch](el,e);});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter){e.preventDefault();A[e.target.dataset.enter](e.target);}});
sheet.addEventListener('close',()=>{sheetGuide=null;});
$('#fileCam').addEventListener('change',e=>browserPhotos([...e.target.files]));
$('#fileGal').addEventListener('change',e=>browserPhotos([...e.target.files]));
function setNavH(){const n=document.querySelector('nav.bottom');if(n)document.documentElement.style.setProperty('--navh',n.getBoundingClientRect().height+'px');}
setNavH();window.addEventListener('resize',setNavH);
window.addEventListener('scroll',()=>{document.querySelector('header.top').classList.toggle('sc',window.scrollY>4);},{passive:true});
D=loadData();
/* Παλιά δεδομένα (επισκευές, δεξιότητες, ανταλλακτικά): πρώτα ένα αντίγραφο «-prin» στον φάκελο αντιγράφων, μετά η μετατροπή. */
if(D._old&&Object.values(D._old).some(x=>x&&Object.keys(x).length))keepSafety('migrate');
D=migrate(D);
if(!NB)lastRec=toRecords(D);
save();applyTheme();render();
noteUpdated();
if(NB){setTimeout(()=>autoBackup(false),2500);setTimeout(()=>updCheck(false),3000);setTimeout(prunePhotos,4000);}
